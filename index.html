<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050510">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>星溝 ― HOSHIMIZO</title>
<style>
:root{
  --gold:#f1c571; --cream:#fbf1dc; --sand:#d9c39a; --ink:#1d1a22; --btn:#151422cc; --btnText:#f3e6c8; --btnLine:#b9a77a66;
  --glow:#ffd46e; --turq:#bfe2ff;
  --serif: Baskerville, "Baskerville Old Face", "Hoefler Text", Garamond, "Times New Roman", Georgia, serif;
  --jserif: "Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --sans: system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;
  --sa-t: env(safe-area-inset-top,0px); --sa-r: env(safe-area-inset-right,0px); --sa-b: env(safe-area-inset-bottom,0px); --sa-l: env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#050510;color:var(--btnText);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
body{background:radial-gradient(120% 95% at 50% 34%, #2a2a52 0%, #161735 36%, #0b0b1c 70%, #050510 100%)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
/* ミニチュア感のピントぼかしは WebGL の最終1パスで描画（全画面 CSS backdrop-filter は廃止） */
.hidden{display:none!important}
button{font:inherit;color:var(--btnText);background:var(--btn);border:1px solid var(--btnLine);border-radius:999px;
  padding:.55em 1.05em;letter-spacing:.06em;cursor:pointer;
  box-shadow:0 2px 10px #0006, inset 0 1px 0 #ffffff12;transition:transform .12s, background .2s, box-shadow .2s;touch-action:manipulation}
button:active{transform:scale(.96)}
button.primary{background:linear-gradient(180deg,#f6d389,#e5b25a);color:var(--ink);border-color:#fbe3a8;font-weight:700;box-shadow:0 4px 18px #f1c57155, inset 0 1px 0 #fff8}
button.on{border-color:#7ff5e6aa;box-shadow:0 0 0 1px #7ff5e655, 0 2px 12px #0007}
button.icon{width:2.6em;height:2.6em;padding:0;display:inline-grid;place-items:center;font-size:1em}
button svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud > *{pointer-events:auto}
body.titleopen #hud{opacity:0;pointer-events:none} #hud{transition:opacity .4s}
body.titleopen #hud > *{pointer-events:none}
#brand{position:absolute;left:calc(14px + var(--sa-l));top:calc(10px + var(--sa-t));pointer-events:none}
#brand .t{font-family:var(--jserif);font-size:clamp(22px,3.4vw,34px);color:var(--cream);letter-spacing:.14em;text-shadow:0 0 18px #f1c57155,0 2px 4px #000a;line-height:1.05}
#brand .s{font-family:var(--serif);font-size:clamp(10px,1.25vw,13px);color:var(--sand);letter-spacing:.32em;margin-top:4px;opacity:.92}
#brand .s b{font-family:var(--jserif);font-weight:400;letter-spacing:.18em}
#stat{position:absolute;right:calc(14px + var(--sa-r));top:calc(10px + var(--sa-t));text-align:right;pointer-events:none}
#gates{display:flex;align-items:center;justify-content:flex-end;gap:9px;font-family:var(--jserif);font-size:clamp(12px,1.4vw,15px);color:var(--sand);letter-spacing:.12em}
#gates i{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid #d9c08a;background:#141226;display:inline-block;transition:all .35s}
#gates i.on{background:var(--glow);border-color:#fff3c8;box-shadow:0 0 10px var(--glow),0 0 22px #ffb84d}
#gates i.pop{animation:pop .6s}
@keyframes pop{0%{transform:rotate(45deg) scale(1)}35%{transform:rotate(45deg) scale(1.9)}100%{transform:rotate(45deg) scale(1)}}
#gateNum{font-family:var(--serif);color:var(--cream);min-width:2.4em}
#meta{margin-top:6px;font-family:var(--serif);font-size:clamp(13px,1.5vw,16px);color:var(--cream);letter-spacing:.08em;display:flex;gap:14px;justify-content:flex-end;font-variant-numeric:tabular-nums}
#meta .k{font-family:var(--jserif);font-size:.78em;color:var(--sand);margin-right:4px;letter-spacing:.12em}
#cps{margin-top:6px;display:flex;gap:3px;justify-content:flex-end}
#cps i{width:5px;height:5px;border-radius:50%;background:#2b2d4a;transition:background .3s,box-shadow .3s}
#cps i.on{background:var(--turq);box-shadow:0 0 6px var(--turq)}
#msg{position:absolute;left:calc(16px + var(--sa-l));bottom:calc(14px + var(--sa-b));max-width:min(62vw,560px);font-family:var(--jserif);
  font-size:clamp(13px,1.6vw,17px);color:var(--cream);letter-spacing:.1em;text-shadow:0 1px 3px #000c;pointer-events:none;transition:opacity .3s}
#msg small{display:block;font-family:var(--sans);font-size:.72em;color:var(--sand);letter-spacing:.06em;margin-top:4px;opacity:.85}
#bar{position:absolute;right:calc(12px + var(--sa-r));bottom:calc(12px + var(--sa-b));display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
#stick{position:absolute;right:calc(26px + var(--sa-r));bottom:calc(76px + var(--sa-b));width:136px;height:136px;border-radius:50%;
  background:radial-gradient(circle,#0f2a31cc 0%,#0b1e26aa 62%,#0b1e2600 70%);border:1px solid #82949455;touch-action:none}
#stick::before{content:"";position:absolute;inset:26%;border-radius:50%;border:1px dashed #d9c08a44}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff3c8,#e8b862 45%,#9a6a2a 100%);box-shadow:0 3px 10px #000a,0 0 14px #f1c57144}
/* overlays */
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--sa-t)) calc(16px + var(--sa-r)) calc(16px + var(--sa-b)) calc(16px + var(--sa-l));
  background:linear-gradient(90deg,#050510e8 0%,#050510a0 42%,#05051010 75%);transition:opacity .45s}
.ov.fade{opacity:0;pointer-events:none}
.panel{width:min(520px,94vw);margin-right:auto;margin-left:min(4vw,48px)}
.bigT{font-family:var(--jserif);font-size:clamp(48px,9vw,96px);color:var(--cream);letter-spacing:.22em;line-height:1;
  text-shadow:0 0 30px #f1c57166,0 0 2px #fff8,0 4px 10px #000c}
.bigS{font-family:var(--serif);color:var(--sand);letter-spacing:.62em;font-size:clamp(11px,1.6vw,15px);margin:10px 0 4px 4px}
.lead{font-family:var(--jserif);color:var(--cream);letter-spacing:.12em;font-size:clamp(13px,1.6vw,16px);margin:14px 0 16px;opacity:.95}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 16px}
.panel{width:min(600px,94vw)}
.card{position:relative;border:1px solid #b9a77a44;border-radius:12px;padding:8px 7px 7px;background:#13122099;cursor:pointer;transition:all .2s;text-align:left}
.card .n{font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:var(--sand)}
.card .j{font-family:var(--jserif);font-size:clamp(12px,1.6vw,16px);white-space:nowrap;color:var(--cream);letter-spacing:.12em;margin:3px 0 2px}
.card .lv{color:var(--glow);font-size:10px;letter-spacing:.05em}
.card .b{font-family:var(--serif);font-size:11px;color:#9fb9b5;margin-top:4px;font-variant-numeric:tabular-nums}
.card.sel{border-color:#f1c571;background:linear-gradient(180deg,#26244add,#141329dd);box-shadow:0 0 0 1px #f1c57166,0 6px 20px #0008}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:11.5px;color:#9fb9b5;letter-spacing:.04em;margin-top:14px;line-height:1.7}
.note b{color:var(--sand);font-weight:500}
#result .panel{margin:0 auto;text-align:center;background:#100f1ed9;border:1px solid #82949455;border-radius:18px;padding:22px 20px 18px;box-shadow:0 10px 40px #000a}
#result{background:transparent;align-items:flex-end}
#result .rt{font-family:var(--jserif);font-size:clamp(26px,4.4vw,40px);color:var(--cream);letter-spacing:.2em;text-shadow:0 0 20px #f1c57188}
#result .rs{font-family:var(--jserif);color:var(--sand);letter-spacing:.14em;margin:6px 0 14px}
#result .nums{display:flex;justify-content:center;gap:22px;font-family:var(--serif);font-size:clamp(18px,2.6vw,24px);color:var(--cream);margin:6px 0 16px;font-variant-numeric:tabular-nums}
#result .nums small{display:block;font-family:var(--jserif);font-size:11px;color:var(--sand);letter-spacing:.2em}
#result .row{justify-content:center}
#result .best{color:var(--glow);font-size:12px;letter-spacing:.2em;min-height:1.2em}
#readyCue{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:4;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#readyCue.show{opacity:1;animation:breathe 2.2s ease-in-out infinite}
#readyCue .a{font-family:var(--jserif);font-size:clamp(20px,3.6vw,32px);color:#fff1d2;letter-spacing:.24em;text-shadow:0 0 18px #f1c57188,0 2px 6px #000c}
#readyCue .b{font-family:var(--jserif);font-size:clamp(11px,1.5vw,14px);color:var(--sand);letter-spacing:.14em;margin-top:8px}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
#result .panel{width:min(440px,92vw);padding:14px 16px 12px;margin-bottom:8px}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:4;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
#toast .a{font-family:var(--jserif);font-size:clamp(26px,5vw,44px);color:#ffe3c8;letter-spacing:.3em;text-shadow:0 0 22px #ff8e65aa,0 3px 8px #000c}
#toast .b{font-family:var(--jserif);font-size:clamp(12px,1.6vw,15px);color:var(--cream);letter-spacing:.16em;margin-top:10px;opacity:0;transition:opacity .2s}
#toast.ready .b{opacity:1}
#starNames{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .8s}
#starNames span{position:absolute;transform:translate(-50%,-160%);font-family:var(--jserif);font-size:clamp(11px,1.5vw,15px);color:#ffe7b0;letter-spacing:.12em;text-shadow:0 0 10px #ffcf7a,0 1px 3px #000;white-space:nowrap}
#flash{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(circle at 50% 50%,#ffe89000 40%,#ffd46e33 100%);transition:opacity .5s}
#err{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:24px;background:#050510;color:var(--cream);font-family:var(--jserif);text-align:center;line-height:1.9}
#loading{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#050510;transition:opacity .6s}
#loading .t{font-family:var(--jserif);font-size:40px;color:var(--cream);letter-spacing:.3em;text-shadow:0 0 24px #f1c57166}
#loading .s{font-family:var(--jserif);color:var(--sand);letter-spacing:.2em;font-size:13px}
@media (max-aspect-ratio: 1/1){
  .ov{align-items:flex-end;background:linear-gradient(0deg,#050510f0 0%,#050510c0 52%,#05051000 85%)}
  .panel{margin:0 auto}
  #bar{max-width:94vw;bottom:calc(10px + var(--sa-b))}
  #msg{bottom:calc(66px + var(--sa-b));max-width:90vw}
  #stick{bottom:calc(120px + var(--sa-b))}
}
@media (max-height: 430px){
  .bigT{font-size:52px} .lead{margin:8px 0 10px} .stages{margin-bottom:10px} .note{margin-top:8px} .card{padding:7px 9px}
  button{padding:.45em .9em} button.icon{width:2.3em;height:2.3em}
  #stick{width:118px;height:118px;bottom:calc(64px + var(--sa-b))}
}
</style>
</head>
<body class="titleopen">
<canvas id="gl" tabindex="0" aria-label="星溝 ゲーム画面"></canvas>

<div id="hud">
  <div id="brand"><div class="t">星溝</div><div class="s">HOSHIMIZO　<b id="hudStage">天球盤</b></div></div>
  <div id="stat">
    <div id="gates"><span>星のゲート</span><span id="gateNum">0 / 3</span></div>
    <div id="meta"><span><span class="k">時間</span><span id="timer">0:00.00</span></span><span><span class="k">落下</span><span id="falls">0</span></span></div>
    <div id="cps"></div>
  </div>
  <div id="msg">星をなぞって、月の盃へ<small id="hint"></small></div>
  <div id="stick" class="hidden"><div id="knob"></div></div>
  <div id="bar">
    <button id="bRetry" title="もう一度（R）">もう一度</button>
    <button id="bDemo" title="お手本（自動プレイ）">お手本</button>
    <button id="bCam" class="icon" title="球を追う（C）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
    <button id="bCal" class="icon hidden" title="今の持ち方を水平にする"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg></button>
    <button id="bMute" class="icon" title="音（M）"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>
    <button id="bMenu" class="icon" title="ステージ選択"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</div>
<div id="flash"></div>
<div id="starNames"></div>
<div id="readyCue"><div class="a">構えて、タップでスタート</div><div class="b">タップした時の角度が水平になります</div></div>
<div id="toast"><div class="a" id="toastA">コースアウト</div><div class="b" id="toastB">タップでもう一度</div></div>

<div id="title" class="ov">
  <div class="panel">
    <div class="bigT">星溝</div>
    <div class="bigS">HOSHIMIZO</div>
    <div class="lead">盤を傾けて星の溝をなぞり、星座を灯して月の盃へ。</div>
    <div class="stages" id="stageCards"></div>
    <div class="row">
      <button class="primary" id="bPlay">プレイする</button>
      <button id="bWatch">お手本を見る</button>
      <button class="icon" id="bMute2" title="音"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>
    </div>
    <div class="note"><b>スマホ</b>：プレイ開始で傾きセンサーの許可を求めます。開始時の持ち方が水平になり、そこから前後左右に傾けて操作します（横持ちも可）。<br><b>PC</b>：矢印キー／WASDで傾ける・ドラッグで視点・R でやり直し・C で球を追う・M で消音。</div>
  </div>
</div>

<div id="result" class="ov hidden">
  <div class="panel">
    <div class="rt" id="resT">ゴール！</div>
    <div class="rs" id="resS">星座が灯った</div>
    <div class="nums"><div><small>時間</small><span id="resTime">0:00.00</span></div><div><small>落下</small><span id="resFalls">0</span></div></div>
    <div class="best" id="resBest"></div>
    <div class="row" style="margin-top:12px"><button class="primary" id="bNext">次のステージへ</button><button id="bAgain">もう一度</button><button id="bSel">ステージ選択</button></div>
  </div>
</div>

<div id="loading"><div class="t">星溝</div><div class="s" id="loadMsg">星座盤を準備しています</div></div>
<div id="err"></div>

<!-- ===================================================================================
  音の差し替え：名前に音声ファイルのURL（相対パス可）か data URI を書くと、その音に置き換わる。
  空文字のままなら内蔵の合成音を鳴らす。実行中は window.__MARBLE.setSound(名前, url) でも差し替え可能。
  roll と bgm はループ再生（roll は球の速さで音量と高さが変わる）。
==================================================================================== -->
<script>
window.SOUND_FILES = {
  roll: '',        // 球が転がる音（ループ）
  rail: '',        // レールに当たる音
  checkpoint: '',  // 通過点の星ランプ（通過ごとに音程が上がる）
  gate: '',        // 星のゲート通過
  boost: '',       // 加速板
  brake: '',       // 減速板
  jump: '',        // ジャンプの踏み切り
  land: '',        // ジャンプの着地
  shutter: '',     // シャッターの開閉
  fall: '',        // コースアウト（落下）
  miss: '',        // 星が足りないままカゴに入った
  clear: '',       // ゴール
  start: '',       // スタート／リトライ
  ui: '',          // ボタン
  connect: '',     // 星座がつながる瞬間（ゴール後）
  door: '',        // スタートの扉が開く
  bgm: '',         // 背景音（ループ）
};
</script>

import {

class RoomEnvironment extends Scene {

		const box2 = new Mesh( geometry, boxMaterial );
		box2.position.set( - 5.607, - 0.754, - 0.758 );
		box2.rotation.set( 0, 0.994, 0 );
		box2.scale.set( 1.970, 1.534, 3.955 );

		const box3 = new Mesh( geometry, boxMaterial );

		box3.scale.set( 3.927, 6.285, 3.687 );

		const box4 = new Mesh( geometry, boxMaterial );
		box4.position.set( - 2.017, 0.018, 6.124 );

		box6.rotation.set( 0, 0.516, 0 );
		box6.scale.set( 3.875, 3.487, 2.986 );

		light3.scale.set( 0.15, 4.265, 6.331 );

		const light4 = new Mesh( geometry, createAreaLightMaterial( 43 ) );
		light4.position.set( - 0.462, 8.89, 14.520 );

		const resources = new Set();

		this.traverse( ( object ) => {

			if ( object.isMesh ) {

				resources.add( object.geometry );
				resources.add( object.material );

			}

		} );

		for ( const resource of resources ) {

			resource.dispose();

		}

	}

}

function createAreaLightMaterial( intensity ) {

	const material = new MeshBasicMaterial();
	material.color.setScalar( intensity );
	return material;

}

export { RoomEnvironment };

<script type="text/plain" id="v-rbox">import {
	BoxGeometry,
	Vector3
} from 'three';

const _tempNormal = new Vector3();

function getUv( faceDirVector, normal, uvAxis, projectionAxis, radius, sideLength ) {

	const totArcLength = 2 * Math.PI * radius / 4;

	// length of the planes between the arcs on each axis
	const centerLength = Math.max( sideLength - 2 * radius, 0 );
	const halfArc = Math.PI / 4;

	// Get the vector projected onto the Y plane
	_tempNormal.copy( normal );
	_tempNormal[ projectionAxis ] = 0;
	_tempNormal.normalize();

	// total amount of UV space alloted to a single arc
	const arcUvRatio = 0.5 * totArcLength / ( totArcLength + centerLength );

	// the distance along one arc the point is at
	const arcAngleRatio = 1.0 - ( _tempNormal.angleTo( faceDirVector ) / halfArc );

	if ( Math.sign( _tempNormal[ uvAxis ] ) === 1 ) {

		return arcAngleRatio * arcUvRatio;

	} else {

		// total amount of UV space alloted to the plane between the arcs
		const lenUv = centerLength / ( totArcLength + centerLength );
		return lenUv + arcUvRatio + arcUvRatio * ( 1.0 - arcAngleRatio );

	}

}

class RoundedBoxGeometry extends BoxGeometry {

	constructor( width = 1, height = 1, depth = 1, segments = 2, radius = 0.1 ) {

		// ensure segments is odd so we have a plane connecting the rounded corners
		segments = segments * 2 + 1;

		// ensure radius isn't bigger than shortest side
		radius = Math.min( width / 2, height / 2, depth / 2, radius );

		super( 1, 1, 1, segments, segments, segments );

		// if we just have one segment we're the same as a regular box
		if ( segments === 1 ) return;

		const geometry2 = this.toNonIndexed();

		this.index = null;
		this.attributes.position = geometry2.attributes.position;
		this.attributes.normal = geometry2.attributes.normal;
		this.attributes.uv = geometry2.attributes.uv;

		//

		const position = new Vector3();
		const normal = new Vector3();

		const box = new Vector3( width, height, depth ).divideScalar( 2 ).subScalar( radius );

		const positions = this.attributes.position.array;
		const normals = this.attributes.normal.array;
		const uvs = this.attributes.uv.array;

		const faceTris = positions.length / 6;
		const faceDirVector = new Vector3();
		const halfSegmentSize = 0.5 / segments;

		for ( let i = 0, j = 0; i < positions.length; i += 3, j += 2 ) {

			position.fromArray( positions, i );
			normal.copy( position );
			normal.x -= Math.sign( normal.x ) * halfSegmentSize;
			normal.y -= Math.sign( normal.y ) * halfSegmentSize;
			normal.z -= Math.sign( normal.z ) * halfSegmentSize;
			normal.normalize();

			positions[ i + 0 ] = box.x * Math.sign( position.x ) + normal.x * radius;
			positions[ i + 1 ] = box.y * Math.sign( position.y ) + normal.y * radius;
			positions[ i + 2 ] = box.z * Math.sign( position.z ) + normal.z * radius;

			normals[ i + 0 ] = normal.x;
			normals[ i + 1 ] = normal.y;
			normals[ i + 2 ] = normal.z;

			const side = Math.floor( i / faceTris );

			switch ( side ) {

				case 0: // right

					// generate UVs along Z then Y
					faceDirVector.set( 1, 0, 0 );
					uvs[ j + 0 ] = getUv( faceDirVector, normal, 'z', 'y', radius, depth );
					uvs[ j + 1 ] = 1.0 - getUv( faceDirVector, normal, 'y', 'z', radius, height );
					break;

				case 1: // left

					// generate UVs along Z then Y
					faceDirVector.set( - 1, 0, 0 );
					uvs[ j + 0 ] = 1.0 - getUv( faceDirVector, normal, 'z', 'y', radius, depth );
					uvs[ j + 1 ] = 1.0 - getUv( faceDirVector, normal, 'y', 'z', radius, height );
					break;

				case 2: // top

					// generate UVs along X then Z
					faceDirVector.set( 0, 1, 0 );
					uvs[ j + 0 ] = 1.0 - getUv( faceDirVector, normal, 'x', 'z', radius, width );
					uvs[ j + 1 ] = getUv( faceDirVector, normal, 'z', 'x', radius, depth );
					break;

				case 3: // bottom

					// generate UVs along X then Z
					faceDirVector.set( 0, - 1, 0 );
					uvs[ j + 0 ] = 1.0 - getUv( faceDirVector, normal, 'x', 'z', radius, width );
					uvs[ j + 1 ] = 1.0 - getUv( faceDirVector, normal, 'z', 'x', radius, depth );
					break;

				case 4: // front

					// generate UVs along X then Y
					faceDirVector.set( 0, 0, 1 );
					uvs[ j + 0 ] = 1.0 - getUv( faceDirVector, normal, 'x', 'y', radius, width );
					uvs[ j + 1 ] = 1.0 - getUv( faceDirVector, normal, 'y', 'x', radius, height );
					break;

				case 5: // back

					// generate UVs along X then Y
					faceDirVector.set( 0, 0, - 1 );
					uvs[ j + 0 ] = getUv( faceDirVector, normal, 'x', 'y', radius, width );
					uvs[ j + 1 ] = 1.0 - getUv( faceDirVector, normal, 'y', 'x', radius, height );
					break;

			}

		}

	}

}

export { RoundedBoxGeometry };

//  progress（進行率 0〜1）で書くもの：gates / openings / widths / gaps.at / boosts.at / shutters.at
// ============================================================================
function helix(cx, cz, r, th0, th1, y0, y1, stepDeg = 30) {
  const out = [], n = Math.max(1, Math.round(Math.abs(th1 - th0) / stepDeg));
  for (let k = 0; k <= n; k++) {
    const th = (th0 + (th1 - th0) * k / n) * Math.PI / 180;
    out.push([+(cx + r * Math.cos(th)).toFixed(3), +(y0 + (y1 - y0) * k / n).toFixed(3), +(cz + r * Math.sin(th)).toFixed(3)]);
  }
  return out;
}

// ---------------------------------------------------------------- 4 静止物の結合（材質ごとに 1 メッシュ）
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _s3 = new THREE.Vector3();
class Batch {

  // geo を matrix で変形して材質ごとにためる
  add(mat, geo, matrix, flags = {}) {
    const g = geo.clone();
    if (!g.index) {
      const cnt = g.attributes.position.count;
      const idx = cnt < 65536 ? new Uint16Array(cnt) : new Uint32Array(cnt);
      for (let i = 0; i < cnt; i++) idx[i] = i;
      g.setIndex(new THREE.BufferAttribute(idx, 1));
    }
    for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(name)) g.deleteAttribute(name);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    if (!g.attributes.normal) g.computeVertexNormals();
    if (matrix) g.applyMatrix4(matrix);
    const key = mat.uuid + (flags.noShadow ? ':ns' : '');
    if (!this.groups.has(key)) this.groups.set(key, { mat, list: [], flags });
    this.groups.get(key).list.push(g);
    return g;
  }
  // 位置・回転(Euler)・拡大で置く
  put(mat, geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1, flags) {
    _e.set(rx, ry, rz); _q.setFromEuler(_e);

    return this.add(mat, geo, _m4, flags);
  }
  // 2 点 a→b を結ぶ円柱
  rod(mat, a, b, r, seg = 8, flags) {
    const d = _v1.set(b[0] - a[0], b[1] - a[1], b[2] - a[2]); const len = d.length();
    if (len < 1e-4) return;
    const geo = new THREE.CylinderGeometry(r, r, len, seg, 1, false);
    _q.setFromUnitVectors(_v2.set(0, 1, 0), d.clone().normalize());
    _m4.compose(_v3.set((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2), _q, _s3.set(1, 1, 1));
    this.add(mat, geo, _m4, flags); geo.dispose();
  }
  build(parent) {
    const meshes = [];
    for (const { mat, list, flags } of this.groups.values()) {
      const merged = mergeGeometries(list, false);
      list.forEach(g => g.dispose());
      const mesh = new THREE.Mesh(merged, mat);
      mesh.castShadow = !flags.noShadow && !mat.transparent;
      mesh.receiveShadow = true;
      mesh.matrixAutoUpdate = false; mesh.updateMatrix();
      if (mat.transparent) mesh.renderOrder = flags.renderOrder ?? 1;
      mesh.name = 'batch:' + mat.name;
      parent.add(mesh); meshes.push(mesh);
    }

}

// ---------------------------------------------------------------- 5 光の粒（halo と パーティクル。各 1 描画）
const glowVS = `
attribute float size; attribute vec3 color; varying vec3 vC; uniform float uScale;
void main(){ vC = color; vec4 mv = modelViewMatrix * vec4(position,1.0); gl_PointSize = size * uScale / -mv.z; gl_Position = projectionMatrix * mv; }`;
const glowFS = `
uniform sampler2D map; varying vec3 vC;
void main(){ float a = texture2D(map, gl_PointCoord).a; gl_FragColor = vec4(vC * a, 1.0);
#include <tonemapping_fragment>
#include <colorspace_fragment>
}`;

  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(count * 3), 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('size', new THREE.BufferAttribute(new Float32Array(count), 1).setUsage(THREE.DynamicDrawUsage));
  const mat = new THREE.ShaderMaterial({ vertexShader: glowVS, fragmentShader: glowFS, uniforms: { map: { value: haloTex }, uScale: { value: 300 } },
    transparent: true, depthWrite: false, blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; pts.renderOrder = renderOrder;
  parent.add(pts);
  return { pts, geo, pos: geo.attributes.position.array, col: geo.attributes.color.array, size: geo.attributes.size.array, count, used: 0 };
}
// 静止〜ゆっくり動く halo（ゲートの星・通過点・ランプ）
const glows = makePoints(160, board, 6);
const glowList = [];   // {x,y,z,r,g,b,size,base} — 毎フレーム書き戻す
function addGlow(x, y, z, color, size) {
  const c = new THREE.Color(color);
  const o = { x, y, z, r: c.r, g: c.g, b: c.b, size, k: 1 };
  glowList.push(o); return o;
}
function flushGlows() {
  const n = Math.min(glowList.length, glows.count);
  for (let i = 0; i < glows.count; i++) {
    if (i < n) { const o = glowList[i]; glows.pos[i*3] = o.x; glows.pos[i*3+1] = o.y; glows.pos[i*3+2] = o.z;
      glows.col[i*3] = o.r * o.k; glows.col[i*3+1] = o.g * o.k; glows.col[i*3+2] = o.b * o.k; glows.size[i] = o.size; }
    else glows.size[i] = 0;
  }
  glows.geo.attributes.position.needsUpdate = glows.geo.attributes.color.needsUpdate = glows.geo.attributes.size.needsUpdate = true;
  glows.geo.setDrawRange(0, n);
}
// パーティクル（花火・きらめき・軌跡）
const parts = makePoints(520, board, 7);
const P_LIFE = new Float32Array(parts.count), P_MAX = new Float32Array(parts.count), P_VEL = new Float32Array(parts.count * 3), P_COL = new Float32Array(parts.count * 3), P_SIZE = new Float32Array(parts.count), P_GRAV = new Float32Array(parts.count);
let pCursor = 0;
function emit(x, y, z, vx, vy, vz, color, size, life, grav = 1) {
  const i = pCursor; pCursor = (pCursor + 1) % parts.count;
  parts.pos[i*3] = x; parts.pos[i*3+1] = y; parts.pos[i*3+2] = z;
  P_VEL[i*3] = vx; P_VEL[i*3+1] = vy; P_VEL[i*3+2] = vz;
  const c = typeof color === 'number' ? _col.setHex(color) : color;
  P_COL[i*3] = c.r; P_COL[i*3+1] = c.g; P_COL[i*3+2] = c.b;
  P_SIZE[i] = size; P_LIFE[i] = life; P_MAX[i] = life; P_GRAV[i] = grav;
}
const _col = new THREE.Color();
function burst(x, y, z, n, colors, speed = 2.2, size = 0.5, life = 1.15, up = 1.2) {
  for (let k = 0; k < n; k++) {
    const u = Math.random() * 2 - 1, th = Math.random() * TAU, r = Math.sqrt(1 - u * u);
    const sp = speed * (0.45 + Math.random() * 0.75);
    emit(x, y, z, r * Math.cos(th) * sp, u * sp * 0.8 + up, r * Math.sin(th) * sp, colors[k % colors.length], size * (0.6 + Math.random() * 0.7), life * (0.7 + Math.random() * 0.5));
  }
}
function updateParticles(dt) {
  const g = 3.2;
  for (let i = 0; i < parts.count; i++) {
    if (P_LIFE[i] <= 0) { parts.size[i] = 0; continue; }
    P_LIFE[i] -= dt;
    const t = Math.max(0, P_LIFE[i] / P_MAX[i]);
    P_VEL[i*3+1] -= g * P_GRAV[i] * dt;
    const damp = Math.exp(-1.6 * dt);
    P_VEL[i*3] *= damp; P_VEL[i*3+1] *= damp; P_VEL[i*3+2] *= damp;
    parts.pos[i*3] += P_VEL[i*3] * dt; parts.pos[i*3+1] += P_VEL[i*3+1] * dt; parts.pos[i*3+2] += P_VEL[i*3+2] * dt;
    const k = t * t * (1.2 - 0.2 * Math.sin(i + P_LIFE[i] * 30));   // ちらつき
    parts.col[i*3] = P_COL[i*3] * k; parts.col[i*3+1] = P_COL[i*3+1] * k; parts.col[i*3+2] = P_COL[i*3+2] * k;
    parts.size[i] = P_SIZE[i] * (0.4 + 0.6 * t);

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// 盤面テクスチャ：黒漆に金粉の天の川、二十八宿の環、螺鈿の欠片、蒔絵の雲（Canvas に手続き生成）
const XIU = '角亢氐房心尾箕斗牛女虚危室壁奎婁胃昴畢觜参井鬼柳星張翼軫';
function deckUV(x, z) { return [(x + 5.05) / 10.1 * 1400, (z + 3.3) / 6.6 * 850]; }
function makeDeckTexture(stage) {
  return canvasTex(1400, 850, (g, w, h) => {
    const R = rng(1234 + stage.id * 77);

    const bg = g.createRadialGradient(w * 0.5, h * 0.45, 50, w * 0.5, h * 0.5, w * 0.75);
    const pal = (stage.palette && stage.palette.deck) || ['#100f1e', '#09080f', '#050409'];
    bg.addColorStop(0, pal[0]); bg.addColorStop(0.6, pal[1]); bg.addColorStop(1, pal[2]);
    g.fillStyle = bg; g.fillRect(0, 0, w, h);

    g.strokeStyle = 'rgba(218,180,100,.22)'; g.lineWidth = 0.8; wave(-70, 12, 1.3); wave(70, 12, 3.0);
    const mwGold = ['rgba(230,196,118,.22)', 'rgba(230,196,118,.36)', 'rgba(230,196,118,.50)', 'rgba(230,196,118,.62)'];
    const mwWhite = ['rgba(255,250,236,.28)', 'rgba(255,250,236,.52)'];

      if (Math.abs(v - Math.sin(u * 0.01) * 10) < 9 && R() < 0.85) continue;   // 暗い筋

    const bgB = [[], [], []];
    for (let i = 0; i < 9000; i++) { const bi = (R() * 3) | 0; bgB[bi].push(R() * w, R() * h); }
    for (let b = 0; b < 3; b++) {
      const arr = bgB[b]; g.fillStyle = bgStyles[b];
      for (let j = 0; j < arr.length; j += 2) g.fillRect(arr[j], arr[j + 1], 1.2, 1.2);
    }

    g.strokeStyle = '#c9a65a'; g.lineWidth = 2.4; g.strokeRect(14, 14, w - 28, h - 28);
    g.lineWidth = 1; g.strokeRect(24, 24, w - 48, h - 48);
    g.strokeStyle = 'rgba(160,40,30,.7)'; g.lineWidth = 1.2; g.strokeRect(30, 30, w - 60, h - 60);

    if (C.shutters.some(sh => Math.abs(sh.s - s) < 0.5)) continue;
    if (st.gates.some(g => Math.abs(g.s - s) < 0.3)) continue;
    if (cpS.length && s - cpS[cpS.length - 1] < 0.7) { if (st.gates.some(g => Math.abs(g.s - 0.55 - s) < 0.01)) cpS[cpS.length - 1] = s; continue; }
    cpS.push(s);
  }
  const lampG = new THREE.OctahedronGeometry(0.06, 0);
  const lamps = new THREE.InstancedMesh(lampG, lampMat, cpS.length); lamps.frustumCulled = false;
  const cpPostG = new THREE.CylinderGeometry(0.012, 0.012, 0.32, 5), cpCupG = new THREE.CylinderGeometry(0.05, 0.03, 0.04, 10);
  cpS.forEach((s, i) => {
    C.frame(s, FR);
    let side = i % 2 ? 1 : -1;
    if (C.isOpening(s, side) || C.openings.some(o => o.side === side && s > o.s0 - 0.8 && s < o.s1 + 0.8)) side = -side;
    const u = side * (FR.half + 0.07);
    B.add(MAT.oxid, cpPostG, frameMatrix(FR, u, 0.11));
    B.add(MAT.gold, cpCupG, frameMatrix(FR, u, 0.27));
    const p = cpt(C, s, u, 0.33);
    lamps.setMatrixAt(i, new THREE.Matrix4().makeTranslation(p[0], p[1], p[2]));
    lamps.setColorAt(i, CP_OFF);
    const glow = addGlow(p[0], p[1], p[2], 0x8ffff0, 0.36); glow.k = 0.0;
    st.cps.push({ s, i, glow, passed: false, p });
  });
  if (cpS.length) { lamps.instanceColor.needsUpdate = true; lamps.instanceMatrix.needsUpdate = true; }
  stageRoot.add(lamps); st.lamps = lamps;
  cpPostG.dispose(); cpCupG.dispose();
  // 上部の小さな点の列（通過点の数）
  document.getElementById('cps').innerHTML = st.cps.map(() => '<i></i>').join('');

  // --- スタート（後ろの止め金具と灯り）
  {
    C.frame(0.05, FR);
    const bump = new THREE.TorusGeometry(0.5, 0.05, 10, 30, Math.PI);
    const m = frameMatrix(FR, 0, 0.13); m.multiply(new THREE.Matrix4().makeRotationX(-Math.PI / 2));
    B.add(MAT.lightGold, bump, m); bump.dispose();
    const capG2 = new THREE.CylinderGeometry(FR.half + 0.05, FR.half + 0.05, 0.06, 24, 1, false, 0, Math.PI);
    const m2 = frameMatrix(FR, 0, -0.055); m2.multiply(new THREE.Matrix4().makeRotationY(Math.PI / 2));
    B.add(MAT.navy, capG2, m2); capG2.dispose();
    const p = cpt(C, 0.05, 0, 0.55); const lg = new THREE.SphereGeometry(0.06, 12, 8); B.put(MAT.white, lg, p[0], p[1], p[2], 0, 0, 0, 1, 1, 1, { noShadow: true }); lg.dispose();
    const rodp = cpt(C, 0.05, 0, 0.0); B.rod(MAT.gold, [rodp[0], rodp[1] - 0.05, rodp[2]], [p[0], p[1] - 0.05, p[2]], 0.018);
    st.startGlow = addGlow(p[0], p[1], p[2], 0xffd590, 0.7);
  }
  // --- スタートの扉（漆の観音開き。構えてタップすると開く）
  {
    const sD = def.startS + 0.5; C.frame(sD, FR);
    const hw = FR.half, mats = [MAT.navy, MAT.gold];
    st.doors = [-1, 1].map(k => {
      const body = new THREE.BoxGeometry(hw, 0.46, 0.035), trim = new THREE.BoxGeometry(hw + 0.02, 0.5, 0.02).translate(0, 0, -0.012);
      const geo = mergeGeometries([body, trim], true); body.dispose(); trim.dispose();
      geo.translate(-k * hw / 2, 0.25, 0);
      const m = new THREE.Mesh(geo, mats); m.castShadow = true; m.matrixAutoUpdate = false; stageRoot.add(m);
      return { k, m, base: frameMatrix(FR, k * hw, 0) };
    });
    const emb = cpt(C, sD, 0, 0.3); addGlow(emb[0], emb[1], emb[2], 0xffe2a0, 0.35).k = 0.6;
  }
  // 天の川の上を通る区間（ガラスの中を光の粒が流れる）
  st.milky = [];
  for (let s2 = 0.3; s2 < L - 0.3; s2 += 0.1) { C.frame(s2, FR); const u = (FR.p[0] + 5.05) / 10.1 * 1400 - 700, v = (FR.p[2] + 3.3) / 6.6 * 850 - 425; if (Math.abs(u * Math.sin(0.42) + v * Math.cos(0.42)) < 105 && !C.gapAt(s2)) st.milky.push(s2); }
  // --- ジャンプ台（踏み切りの縁と着地の縁）
  for (const g of C.gaps) {
    for (const s of [g.s0, g.s1]) {
      C.frame(s, FR);
      const m = frameMatrix(FR, 0, -0.01); m.multiply(new THREE.Matrix4().makeRotationZ(Math.PI / 2));
      const lg = new THREE.CylinderGeometry(0.045, 0.045, FR.half * 2 + 0.1, 10); B.add(MAT.lightGold, lg, m); lg.dispose();
      for (const k of [-1, 1]) { const p = cpt(C, s, k * (FR.half + 0.05), 0.2); const sg = new THREE.SphereGeometry(0.05, 10, 8); B.put(MAT.white, sg, p[0], p[1], p[2], 0, 0, 0, 1, 1, 1, { noShadow: true }); sg.dispose(); addGlow(p[0], p[1], p[2], 0xffd590, 0.45); }
    }
  }
  // --- 加速板（流れる矢印）と減速板（逆向きの橙の矢印）
  for (const kind of ['boost', 'brake']) {
    const list = C.boosts.filter(b => b.kind === kind); if (!list.length) continue;
    const geos = list.map(b => { const g = courseRibbon(null, C, b.s0, b.s1, null, 0.012, 0.82); if (kind === 'brake') { const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, -uv.getY(i)); } return g; });
    const merged = mergeGeometries(geos); geos.forEach(g => g.dispose());
    const bm = new THREE.Mesh(merged, kind === 'boost' ? boostMat : brakeMat); bm.renderOrder = 2; stageRoot.add(bm);
    for (const b of list) { const p = cpt(C, (b.s0 + b.s1) / 2, 0, 0.1); addGlow(p[0], p[1], p[2], kind === 'boost' ? 0x6ffff0 : 0xffb060, 0.7).k = 0.6; }
  }
  // --- トンネルのアーチ（S2）
  if (def.tunnel) {
    const aG = new THREE.TorusGeometry(0.68, 0.03, 8, 32, Math.PI), iG = new THREE.TorusGeometry(0.68, 0.012, 5, 32, Math.PI), fG = new THREE.CylinderGeometry(0.05, 0.07, 0.12, 10), bG = new THREE.SphereGeometry(0.04, 10, 8);
    let k = 0;
    for (let s = def.tunnel[0] * L; s <= def.tunnel[1] * L; s += 0.42, k++) {
      C.frame(s, FR);
      B.add(k % 2 ? MAT.teal : MAT.gold, aG, frameMatrix(FR));
      const mi = frameMatrix(FR); mi.multiply(new THREE.Matrix4().makeTranslation(0, 0, 0.035)); B.add(MAT.turq, iG, mi, { noShadow: true });
      for (const u of [-0.68, 0.68]) B.add(MAT.navy, fG, frameMatrix(FR, u, -0.03));
      if (k % 2 === 0) { const p = cpt(C, s, 0, 0.7); B.put(MAT.white, bG, p[0], p[1], p[2], 0, 0, 0, 1, 1, 1, { noShadow: true }); addGlow(p[0], p[1], p[2], 0xffe4b0, 0.4); }
    }
    [aG, iG, fG, bG].forEach(g => g.dispose());
  }
  // --- シャッター（S3）
  for (const sh of C.shutters) buildShutter(st, B, C, sh);
  // --- ゴールのカゴ
  buildBasket(st, B, C);
  // --- 置物
  buildOrnaments(st, B, def);
  // --- 支柱（下のコースや置物とぶつからない所だけ）
  buildSupports(st, B, C);

  st.meshes = B.build(stageRoot);
  updateGears(0);
  flushGlows();
  return st;
}

// シャッター：門型の枠（固定）＋上下する格子（動く）
function buildShutter(st, B, C, sh) {
  C.frame(sh.s, FR);
  const half = FR.half, H = 1.3;
  const postG = new THREE.CylinderGeometry(0.045, 0.05, H + 0.1, 10);
  for (const k of [-1, 1]) B.add(MAT.gold, postG, frameMatrix(FR, k * (half + 0.1), H / 2 - 0.05));
  const beamG = new RoundedBoxGeometry(half * 2 + 0.42, 0.16, 0.2, 2, 0.04);
  B.add(MAT.navy, beamG, frameMatrix(FR, 0, H + 0.02));
  const trimG = new THREE.BoxGeometry(half * 2 + 0.46, 0.03, 0.22); B.add(MAT.gold, trimG, frameMatrix(FR, 0, H - 0.07)); B.add(MAT.gold, trimG, frameMatrix(FR, 0, H + 0.11));
  const lampG = new THREE.SphereGeometry(0.05, 10, 8);
  const lp = cpt(C, sh.s, 0, H + 0.17); B.put(MAT.white, lampG, lp[0], lp[1], lp[2], 0, 0, 0, 1, 1, 1, { noShadow: true });
  [postG, beamG, trimG, lampG].forEach(g => g.dispose());
  // 動く格子：金の枠＋青緑の縦棒を 1 つのジオメトリに（材質は金、縦棒も金系で 1 描画）
  const parts = [];
  const W = half * 2 - 0.05, Hh = 0.52;
  parts.push(new THREE.BoxGeometry(W, 0.05, 0.06).translate(0, Hh, 0), new THREE.BoxGeometry(W, 0.05, 0.06).translate(0, 0.03, 0));
  for (let k = 0; k < 5; k++) parts.push(new THREE.CylinderGeometry(0.022, 0.022, Hh, 6).translate(-W / 2 + 0.06 + k * (W - 0.12) / 4, Hh / 2 + 0.02, 0));
  parts.push(new THREE.ConeGeometry(0.03, 0.08, 6).rotateX(Math.PI).translate(-W / 2 + 0.06, -0.02, 0));
  parts.forEach(g => { g.deleteAttribute('uv'); });
  const geo = mergeGeometries(parts.map(g => g.index ? g : g.setIndex([...Array(g.attributes.position.count).keys()]))); parts.forEach(g => g.dispose());
  const mesh = new THREE.Mesh(geo, MAT.lightGold); mesh.castShadow = true;
  mesh.matrixAutoUpdate = false;
  stageRoot.add(mesh);
  const glow = addGlow(lp[0], lp[1], lp[2], 0x7ff5e6, 0.6);
  st.shutters.push({ ...sh, mesh, base: frameMatrix(FR, 0, 0), glow, lastClosed: null });
  gearList.push({ x: FR.p[0] + FR.n[0] * (H + 0.02) + FR.t[0] * 0.13, y: FR.p[1] + FR.n[1] * (H + 0.02) + FR.t[1] * 0.13, z: FR.p[2] + FR.n[2] * (H + 0.02) + FR.t[2] * 0.13, r: 0.17, axis: 'z', yaw: Math.atan2(FR.t[0], FR.t[2]), speed: 1.4, ang: 0 });
  st.footprints.push({ x: FR.p[0], z: FR.p[2], r: half + 0.25, top: FR.p[1] + H + 0.3, kind: 'shutter', s: sh.s });
}

// 月の盃（ゴール）
function buildBasket(st, B, C) {
  C.frame(C.L, FR);
  const th = Math.hypot(FR.t[0], FR.t[2]), tx = FR.t[0] / th, tz = FR.t[2] / th;
  const bx = FR.p[0] + tx * 0.36, bz = FR.p[2] + tz * 0.36;
  const entry = Math.atan2(-tz, -tx);
  const y0 = CFG.DECK_Y;
  const dais = new THREE.CylinderGeometry(0.7, 0.78, 0.06, 48); B.put(MAT.navy, dais, bx, y0 + 0.03, bz);
  const ring0 = new THREE.TorusGeometry(0.74, 0.02, 8, 64); B.put(MAT.gold, ring0, bx, y0 + 0.06, bz, Math.PI / 2);
  // 盃の内側は螺鈿
  const bowl = new THREE.SphereGeometry(0.5, 40, 10, 0, TAU, Math.PI * 0.62, Math.PI * 0.38); B.put(MAT.pearl, bowl, bx, y0 + 0.36, bz, 0, 0, 0, 1, 0.62, 1);
  const r1 = new THREE.TorusGeometry(0.49, 0.045, 10, 56); B.put(MAT.lightGold, r1, bx, y0 + 0.1, bz, Math.PI / 2);
  const gapA = 0.75;
  const r2 = new THREE.TorusGeometry(0.62, 0.05, 10, 56, TAU - gapA * 2); B.put(MAT.gold, r2, bx, y0 + 0.24, bz, Math.PI / 2, 0, entry + gapA);
  for (let k = 0; k < 24; k++) {
    const a = k / 24 * TAU; const da = ((a - entry + Math.PI * 3) % TAU) - Math.PI;
    if (Math.abs(da) < gapA + 0.1) continue;
    B.rod(MAT.gold, [bx + Math.cos(a) * 0.49, y0 + 0.1, bz + Math.sin(a) * 0.49], [bx + Math.cos(a + 0.2) * 0.62, y0 + 0.24, bz + Math.sin(a + 0.2) * 0.62], 0.012, 5);
  }
  // 奥に三日月（白金）
  const far = entry + Math.PI, px = bx + Math.cos(far) * 0.82, pz = bz + Math.sin(far) * 0.82;
  B.rod(MAT.gold, [px, y0, pz], [px, y0 + 0.62, pz], 0.022);
  const moon = new THREE.TorusGeometry(0.2, 0.05, 10, 30, Math.PI * 1.25); B.put(MAT.lightGold, moon, px, y0 + 0.86, pz, 0, -far + Math.PI / 2, 2.1);
  const mg = addGlow(px, y0 + 0.86, pz, 0xfff2d0, 0.7); mg.k = 0.8;

  st.basketGlow = addGlow(bx, y0 + 0.35, bz, 0xfff0c8, 1.6); st.basketGlow.k = 0.25;
  st.footprints.push({ x: bx, z: bz, r: 0.8, top: y0 + 0.4, kind: 'basket' });
  st.footprints.push({ x: px, z: pz, r: 0.3, top: y0 + 1.1, kind: 'goalplate' });
}

// 支柱：中心線の真下に立てられない所は、外側の細い柱か、何も立てない
function buildSupports(st, B, C) {
  const blocked = (x, z, top, sHere, rad) => {
    for (let j = 0; j <= C.M; j += 2) {
      const sj = j * C.ds; if (Math.abs(sj - sHere) < 1.3) continue;
      const d = Math.hypot(C.P[j*3] - x, C.P[j*3+2] - z);
      if (d < C.half[j] + rad + 0.16 && C.P[j*3+1] < top + 0.15) return true;
    }
    for (const f of st.footprints) if (Math.hypot(f.x - x, f.z - z) < f.r + rad + 0.05) return true;
    return Math.abs(x) > 4.95 || Math.abs(z) > 3.2;
  };
  const colG = new THREE.CylinderGeometry(0.053, 0.053, 1, 10), b1 = new THREE.CylinderGeometry(0.15, 0.15, 0.06, 18), b2 = new THREE.CylinderGeometry(0.105, 0.105, 0.14, 16), cG = new THREE.CylinderGeometry(0.081, 0.081, 0.10, 14);
  const thinG = new THREE.CylinderGeometry(0.03, 0.03, 1, 8), footG = new THREE.CylinderGeometry(0.08, 0.1, 0.06, 12);
  let n = 0;
  st.supports = [];
  for (let s = 0.8; s < C.L - 0.3; s += 1.55) {
    if (C.gapAt(s) || C.gaps.some(g => s > g.s0 - 0.2 && s < g.s1 + 0.1)) continue;
    C.frame(s, FR);
    const top = FR.p[1] - 0.07;
    if (top < 0.26) continue;
    if (!blocked(FR.p[0], FR.p[2], top, s, 0.15)) {
      const y0 = CFG.DECK_Y;
      B.put(n % 2 ? MAT.teal : MAT.navy, colG, FR.p[0], (y0 + top) / 2, FR.p[2], 0, 0, 0, 1, top - y0, 1);
      B.put(MAT.gold, b1, FR.p[0], y0 + 0.03, FR.p[2]); B.put(MAT.gold, b2, FR.p[0], y0 + 0.13, FR.p[2]); B.put(MAT.gold, cG, FR.p[0], top - 0.05, FR.p[2]);
      st.supports.push({ x: FR.p[0], z: FR.p[2], top, kind: 'pedestal' }); n++;
      continue;
    }
    // 外側の細い柱
    for (const k of [-1, 1]) {
      if (C.openings.some(o => o.side === k && s > o.s0 - 0.6 && s < o.s1 + 0.6)) continue;
      const u = k * (FR.half + 0.14);
      const x = FR.p[0] + FR.l[0] * u, z = FR.p[2] + FR.l[2] * u, t2 = FR.p[1] - 0.03;
      if (t2 < 0.26 || blocked(x, z, t2, s, 0.06)) continue;
      const y0 = CFG.DECK_Y;
      B.put(MAT.oxid, thinG, x, (y0 + t2) / 2, z, 0, 0, 0, 1, t2 - y0, 1);
      B.put(MAT.gold, footG, x, y0 + 0.03, z);
      const q = cpt(C, s, k * FR.half, -0.025); B.rod(MAT.oxid, [x, t2, z], q, 0.022, 6);
      st.supports.push({ x, z, top: t2, kind: 'side' });
      break;
    }
  }
  // 螺旋の中心からの腕（ハブ）
  for (const hub of st.hubs) {
    for (let s = hub.s0; s <= hub.s1; s += 0.95) {
      C.frame(s, FR);
      const dx = hub.x - FR.p[0], dz = hub.z - FR.p[2];
      const side = Math.sign(dx * FR.l[0] + dz * FR.l[2]) || 1;
      const a = cpt(C, s, side * FR.half, -0.04);
      const d = Math.hypot(dx, dz);
      const b = [hub.x - dx / d * hub.r, a[1] - 0.06, hub.z - dz / d * hub.r];
      B.rod(MAT.teal, a, b, 0.026, 6);
    }
  }
  [colG, b1, b2, cG, thinG, footG].forEach(g => g.dispose());
}

// ---------------------------------------------------------------- 8 置物（基本図形の組み立て。動く物以外はすべて結合）
let _planetTex = null, _clockTex = null;
function getPlanetTex() {
  if (!_planetTex) _planetTex = canvasTex(800, 400, (g, W, H) => {
    const R = rng(7);
    for (let y = 0; y < H; y++) { const t = y / H; const h = 28 + Math.sin(t * 19) * 8 + Math.sin(t * 47) * 3; const l = 52 + Math.sin(t * 13 + 1) * 10 + Math.sin(t * 61) * 4; g.fillStyle = `hsl(${h},${58 + Math.sin(t * 7) * 12}%,${l}%)`; g.fillRect(0, y, W, 1); }
    g.strokeStyle = 'rgba(255,226,150,.55)'; g.lineWidth = 0.8;
    for (let k = 0; k < 1300; k++) { const y = R() * H, x = R() * W, l = 10 + R() * 60; g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + (R() - 0.5) * 2); g.stroke(); }
  });
  return _planetTex;
}
function getClockTex() {
  if (!_clockTex) _clockTex = canvasTex(512, 512, (g, W) => {
    const c = W / 2;
    const gr = g.createRadialGradient(c, c, 10, c, c, c); gr.addColorStop(0, '#fff6dc'); gr.addColorStop(0.85, '#efd9a8'); gr.addColorStop(1, '#b98d4a');
    g.fillStyle = gr; g.beginPath(); g.arc(c, c, c - 2, 0, TAU); g.fill();
    g.strokeStyle = '#7a5a2a'; g.lineWidth = 6; g.beginPath(); g.arc(c, c, c - 18, 0, TAU); g.stroke();
    g.lineWidth = 2; g.beginPath(); g.arc(c, c, c - 70, 0, TAU); g.stroke();
    g.fillStyle = '#3b2a12'; g.font = 'bold 50px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const rn = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
    for (let k = 0; k < 12; k++) { const a = k / 12 * TAU - Math.PI / 2; g.save(); g.translate(c + Math.cos(a) * (c - 46), c + Math.sin(a) * (c - 46)); g.rotate(a + Math.PI / 2); g.font = (k % 3 === 0 ? 'bold 44px' : '34px') + ' Georgia, serif'; g.fillText(rn[k], 0, 0); g.restore(); }
    for (let k = 0; k < 60; k++) { const a = k / 60 * TAU; g.lineWidth = k % 5 ? 2 : 5; g.beginPath(); g.moveTo(c + Math.cos(a) * (c - 22), c + Math.sin(a) * (c - 22)); g.lineTo(c + Math.cos(a) * (c - (k % 5 ? 30 : 36)), c + Math.sin(a) * (c - (k % 5 ? 30 : 36))); g.stroke(); }
    g.fillStyle = '#c99a3e'; for (let k = 0; k < 8; k++) { const a = k / 8 * TAU; g.beginPath(); g.moveTo(c, c); g.arc(c, c, 92, a - 0.06, a + 0.06); g.fill(); }
    g.fillStyle = '#7a5a2a'; g.beginPath(); g.arc(c, c, 16, 0, TAU); g.fill();
  });
  return _clockTex;
}

function buildOrnaments(st, B, def) {
  const o = def.ornaments || {}, Y0 = CFG.DECK_Y;
  st.dyn = {};
  if (o.dome) buildDome(st, B, o.dome[0], o.dome[1]);
  if (o.orrery) buildOrrery(st, B, o.orrery[0], o.orrery[1], o.orreryY ?? 2.18, o.orreryScale ?? 1, !!o.orreryHub);
  if (o.telescope) buildTelescope(st, B, o.telescope[0], o.telescope[1]);
  if (o.tower) buildClockTower(st, B, o.tower[0], o.tower[1]);
  if (o.armillary) buildArmillary(st, B, o.armillary[0], o.armillary[1]);
  if (o.lantern) buildLantern(st, B, o.lantern[0], o.lantern[1]);
  if (o.lantern2) buildLantern(st, B, o.lantern2[0], o.lantern2[1]);
  if (o.moonOrb) buildMoonOrb(st, B, o.moonOrb[0], o.moonOrb[1]);
  if (o.medallions) for (const x of [-2.75, 2.75]) {
    const d = new THREE.CylinderGeometry(0.2, 0.2, 0.03, 32); B.put(MAT.pearl, d, x, -0.64, 3.565, Math.PI / 2); d.dispose();
    const r = new THREE.TorusGeometry(0.21, 0.025, 8, 32); B.put(MAT.gold, r, x, -0.64, 3.585); r.dispose();
    const s8 = new THREE.OctahedronGeometry(0.07, 0); B.put(MAT.gold, s8, x, -0.64, 3.59, 0, 0, Math.PI / 4, 1, 1, 0.3); s8.dispose();

  if (G.gateCount === S.gates.length) S.basketGlow.k = 1.4;
  logEvent('gate', { n: G.gateCount, progress: +(G.ball.s / S.C.L).toFixed(4) });
}
function reqCpBefore(s) { let n = 0; for (const c of S.cps) if (c.s < s) n++; return n; }

// 1 刻み
function step(dt) {
  G.time += dt; G.shClock += dt;
  // 入力 → 目標の傾き → なめらかに追従
  const inp = currentInput(dt);
  G.tilt.tz = clamp(inp.z, -1, 1) * CFG.TILT_MAX;   // x 軸まわり（手前へ転がす = +）
  G.tilt.tx = -clamp(inp.x, -1, 1) * CFG.TILT_MAX;  // z 軸まわり（右へ転がす = 右が下がる = 負）
  const k = 1 - Math.exp(-CFG.TILT_SMOOTH * dt);
  G.tilt.rx += (G.tilt.tz - G.tilt.rx) * k;
  G.tilt.rz += (G.tilt.tx - G.tilt.rz) * k;
  if (G.state === 'playing' || G.state === 'falling' || G.state === 'failed' || G.state === 'clear') {
    const b = G.ball;
    if (b.mode === 'ground') stepGround(dt);
    else if (b.mode === 'air') stepAir(dt);
    else if (b.mode === 'fall') stepFall(dt);
    else if (b.mode === 'basket') stepBasket(dt);
  }
  if (G.state === 'intro') { G.introT += dt; if (G.introT >= INTRO_DUR) endIntro(); }
  if (G.state === 'playing') G.timer += dt;
  if (G.state === 'falling' && (G.time - G.fallAt >= CFG.FAIL_AT || G.ball.impact)) failNow('fall');
  if ((G.state === 'failed') && G.autoRetryAt > 0 && G.time >= G.autoRetryAt) retry();
  if (G.state === 'clear' && G.mode === 'demo' && G.demoLoop && G.time - G.clearAt > 3.2) startRun('demo');
}

const TMP = [0, 0, 0];
function stepGround(dt) {
  const b = G.ball, C = S.C;
  C.frame(b.s, FR);
  const n = FR.n, t = FR.t, l = FR.l;
  const g = gravityLocal();
  const gn = v3.dot(g, n);
  const drag = CFG.DRAG_G;
  for (let i = 0; i < 3; i++) b.v[i] += ((g[i] - gn * n[i]) * CFG.ROLL - drag * b.v[i]) * dt;
  // 加速板：通過中は進行方向の速さを決まった範囲にそろえ、横の揺れを抑える
  const bo = C.boostAt(b.s);
  if (bo) {
    const vt = v3.dot(b.v, t); let nv = vt;
    if (vt < bo.vMin) nv = Math.min(bo.vMin, vt + 40 * dt); else if (vt > bo.vMax) nv = Math.max(bo.vMax, vt - 40 * dt);
    for (let i = 0; i < 3; i++) b.v[i] += (nv - vt) * t[i];
    if (bo.kind === 'boost') { const vl = v3.dot(b.v, l), damp = 1 - Math.exp(-7 * dt); for (let i = 0; i < 3; i++) b.v[i] += (-vl * damp - b.u * 5 * dt) * l[i]; }
    if (b.boosting !== bo) { b.boosting = bo; Sound.play(bo.kind === 'boost' ? 'boost' : 'brake'); logEvent(bo.kind, { vt: +vt.toFixed(2) }); }
  } else b.boosting = null;
  const sp0 = Math.hypot(b.v[0], b.v[1], b.v[2]);
  for (let i = 0; i < 3; i++) b.p[i] += b.v[i] * dt;
  // 球の中心から面の接点へ（直前の法線で）戻してから中心線へ射影
  const nr = C.nearest(b.p[0] - n[0] * BALL_R, b.p[1] - n[1] * BALL_R, b.p[2] - n[2] * BALL_R, b.i, 14);
  b.prevS = b.s; b.s = nr.s; b.i = nr.i;
  // 終点 → カゴへ
  if (b.s >= C.L - 0.004) { b.mode = 'basket'; G.basketAt = G.time; logEvent('basket'); return; }
  // スタートの止め金具
  if (b.s < 0.16) {
    b.s = 0.16; C.frame(b.s, FR);
    const vt = v3.dot(b.v, FR.t); if (vt < 0) for (let i = 0; i < 3; i++) b.v[i] -= 1.3 * vt * FR.t[i];
  }
  // ジャンプ台の隙間に入った → 空中へ
  const gap = C.gapAt(b.s);
  if (gap) { b.mode = 'air'; b.gap = gap; G.jumps.tries++; G.jumpT0 = G.time; Sound.play('jump'); logEvent('jump', { vt: +v3.dot(b.v, FR.t).toFixed(2), u: +b.u.toFixed(3) }); return; }
  C.frame(b.s, FR);
  const dx = b.p[0] - FR.p[0], dy = b.p[1] - FR.p[1], dz = b.p[2] - FR.p[2];
  let u = dx * FR.l[0] + dy * FR.l[1] + dz * FR.l[2];
  const umax = FR.half - RAIL_CLEAR, side = u >= 0 ? 1 : -1;
  const open = C.isOpening(b.s, side);
  b.onOpening = open && Math.abs(u) > umax * 0.6;
  if (Math.abs(u) > umax) {
    if (!open) {
      u = side * umax;
      const vl = v3.dot(b.v, FR.l);
      if (vl * side > 0) { for (let i = 0; i < 3; i++) b.v[i] -= (1 + CFG.RAIL_E) * vl * FR.l[i]; G.railHits++; if (Math.abs(vl) > 0.25) Sound.play('rail', { v: Math.abs(vl) }); }
    } else if (Math.abs(u) > FR.half + 0.02) {
      b.u = u; fallStart('opening'); return;
    }
  }
  // シャッター
  for (const sh of S.shutters) {
    const c = shutterClosed(sh);
    if (c < 0.35) continue;
    const lim = 0.07 + BALL_R * 0.9;
    if (b.s < sh.s && b.s > sh.s - lim && b.prevS <= sh.s - lim + 0.12) {
      b.s = sh.s - lim; C.frame(b.s, FR);
      const vt = v3.dot(b.v, FR.t); if (vt > 0) { for (let i = 0; i < 3; i++) b.v[i] -= 1.35 * vt * FR.t[i]; if (vt > 0.3) Sound.play('rail', { v: vt }); }
    } else if (b.s > sh.s && b.s < sh.s + lim && b.prevS >= sh.s + lim - 0.12) {
      b.s = sh.s + lim; C.frame(b.s, FR);
      const vt = v3.dot(b.v, FR.t); if (vt < 0) for (let i = 0; i < 3; i++) b.v[i] -= 1.35 * vt * FR.t[i];
    }
  }
  b.u = u;
  for (let i = 0; i < 3; i++) b.p[i] = FR.p[i] + FR.l[i] * u + FR.n[i] * BALL_R;
  // 面に沿った速度に直し、速さは保つ
  const vn = v3.dot(b.v, FR.n);
  for (let i = 0; i < 3; i++) b.v[i] -= vn * FR.n[i];
  const sp1 = Math.hypot(b.v[0], b.v[1], b.v[2]);
  if (sp1 > 1e-6) { const kk = Math.min(sp0, sp1 * 1.02) / sp1; for (let i = 0; i < 3; i++) b.v[i] *= kk; }
  rollBall(FR.n, dt);
  progressCheck();
}
function progressCheck() {
  const b = G.ball;
  if (G.state !== 'playing') return;
  // 通過点（順番どおりのみ）
  while (G.cpNext < S.cps.length) {
    const c = S.cps[G.cpNext];
    if (b.prevS < c.s && b.s >= c.s) passCheckpoint(G.cpNext); else break;
  }
  // ゲート（順番どおり、かつ手前の通過点を全部通っている時だけ）
  const g = S.gates[G.gateCount];
  if (g && !g.passed) {
    const P = b.s / S.C.L, crossed = b.prevS < g.s && b.s >= g.s;
    if ((Math.abs(P - g.p) < 0.018 || crossed) && G.cpNext >= reqCpBefore(g.s) && b.s >= g.s - 0.05) passGate(g);
  }
}
function rollBall(n, dt) {
  const b = G.ball;
  // ω = n × v / R
  const wx = (n[1] * b.v[2] - n[2] * b.v[1]) / BALL_R, wy = (n[2] * b.v[0] - n[0] * b.v[2]) / BALL_R, wz = (n[0] * b.v[1] - n[1] * b.v[0]) / BALL_R;
  const w = Math.hypot(wx, wy, wz);
  if (w > 1e-5) { _q.setFromAxisAngle(_v1.set(wx / w, wy / w, wz / w), w * dt); b.q.premultiply(_q); }
}

function stepAir(dt) {
  const b = G.ball, C = S.C, g = gravityLocal(), gap = b.gap;
  for (let i = 0; i < 3; i++) { b.v[i] += (g[i] - CFG.DRAG_A * b.v[i]) * dt; b.p[i] += b.v[i] * dt; }
  const i0 = C.idx(gap.s0 - 0.4), i1 = C.idx(gap.s1 + 2.4);
  const nr = C.nearest(b.p[0], b.p[1] - BALL_R, b.p[2], (i0 + i1) >> 1, (i1 - i0) >> 1);
  C.frame(nr.s, FR);
  const dx = b.p[0] - FR.p[0], dy = b.p[1] - FR.p[1], dz = b.p[2] - FR.p[2];
  const h = dx * FR.n[0] + dy * FR.n[1] + dz * FR.n[2], u = dx * FR.l[0] + dy * FR.l[1] + dz * FR.l[2];
  b.s = nr.s; b.i = nr.i; b.u = u;
  const vn = v3.dot(b.v, FR.n);
  if (nr.s >= gap.s1 + 0.02 && h <= BALL_R && Math.abs(u) <= FR.half + 0.1 && vn < 0) {
    // 正規の着地（ジャンプの着地点だけ）
    const umax = FR.half - RAIL_CLEAR, uu = clamp(u, -umax, umax);
    for (let i = 0; i < 3; i++) { b.v[i] -= vn * FR.n[i]; b.p[i] = FR.p[i] + FR.l[i] * uu + FR.n[i] * BALL_R; }
    if (Math.abs(u) > umax) { const vl = v3.dot(b.v, FR.l); if (vl * u > 0) for (let i = 0; i < 3; i++) b.v[i] -= (1 + CFG.RAIL_E) * vl * FR.l[i]; }
    b.mode = 'ground'; b.prevS = gap.s1; b.u = uu; b.gap = null;
    G.jumps.ok++; G.jumps.log.push({ stage: S.def.id, landS: +(nr.s - gap.s1).toFixed(3), u: +u.toFixed(3), flight: +(G.time - G.jumpT0).toFixed(3) });
    Sound.play('land'); burst(b.p[0], b.p[1] - BALL_R, b.p[2], 18, [0x8ffff0, 0xffe8a0, 0xffffff], 1.3, 0.3, 0.5, 0.3);
    logEvent('land', { d: +(nr.s - gap.s1).toFixed(3), u: +u.toFixed(3) });
    progressCheck();
    return;
  }
  if (h < -0.3 || (nr.s < gap.s1 && h < -0.2) || Math.abs(u) > FR.half + 0.6) {
    b.mode = 'fall'; fallStart('gap'); return;
  }
  rollBall([0, 1, 0], dt * 0.3);
}

function stepFall(dt) {
  const b = G.ball, C = S.C, g = gravityLocal();
  for (let i = 0; i < 3; i++) { b.v[i] += (g[i] - CFG.DRAG_A * b.v[i]) * dt; b.p[i] += b.v[i] * dt; }
  const onBoard = Math.abs(b.p[0]) < 5.05 && Math.abs(b.p[2]) < 3.3;
  if (onBoard && b.p[1] - BALL_R < CFG.DECK_Y) {
    b.p[1] = CFG.DECK_Y + BALL_R;
    if (b.v[1] < 0) { if (!b.impact && b.v[1] < -1) burst(b.p[0], CFG.DECK_Y + 0.02, b.p[2], 14, [0xffb08a, 0xffe8c0], 1.2, 0.3, 0.5, 0.4); b.v[1] = -b.v[1] * 0.35; b.v[0] *= 0.85; b.v[2] *= 0.85; }
    b.impact = true;
  }
  // 下のコースのガラスに当たったら跳ねる（ただし失敗のまま）
  const nr = C.nearest(b.p[0], b.p[1] - BALL_R, b.p[2], b.i, -1);
  C.frame(nr.s, FR2);
  const dx = b.p[0] - FR2.p[0], dy = b.p[1] - FR2.p[1], dz = b.p[2] - FR2.p[2];
  const h = dx * FR2.n[0] + dy * FR2.n[1] + dz * FR2.n[2], u = dx * FR2.l[0] + dy * FR2.l[1] + dz * FR2.l[2];
  if (Math.abs(u) < FR2.half && h < BALL_R && h > -0.12 && !C.gapAt(nr.s)) {
    const vn = v3.dot(b.v, FR2.n);
    if (vn < 0) { for (let i = 0; i < 3; i++) { b.p[i] += (BALL_R - h) * FR2.n[i]; b.v[i] -= 1.35 * vn * FR2.n[i]; } b.impact = true; }
  }
  if (b.p[1] < -2.6) { b.v = [0, 0, 0]; b.p[1] = -2.6; }
  rollBall([0, 1, 0], dt * 0.5);
}

function stepBasket(dt) {
  const b = G.ball, g = gravityLocal(), K = S.basket;
  for (let i = 0; i < 3; i++) { b.v[i] += (g[i] - CFG.DRAG_A * b.v[i]) * dt; b.p[i] += b.v[i] * dt; }
  const dx = b.p[0] - K.x, dz = b.p[2] - K.z, d = Math.hypot(dx, dz);
  if (d > K.rWall) {
    const nx = dx / d, nz = dz / d; b.p[0] = K.x + nx * K.rWall; b.p[2] = K.z + nz * K.rWall;
    const vr = b.v[0] * nx + b.v[2] * nz; if (vr > 0) { b.v[0] -= 1.3 * vr * nx; b.v[2] -= 1.3 * vr * nz; if (vr > 0.5) Sound.play('rail', { v: vr }); }
  }
  if (b.p[1] - BALL_R < K.y) {
    b.p[1] = K.y + BALL_R; if (b.v[1] < 0) b.v[1] = -b.v[1] * 0.3;
    const f = Math.exp(-2.5 * dt); b.v[0] *= f; b.v[2] *= f;
    rollBall([0, 1, 0], dt);
  }
  if (G.state === 'playing' && G.time - G.basketAt > 0.3) {
    if (G.gateCount === S.gates.length && G.cpNext >= S.cps.length) clearRun();
    else { G.state = 'failed'; failNow('stars'); logEvent('miss', { gates: G.gateCount, cps: G.cpNext }); }
  }
}

function clearRun() {
  G.state = 'clear'; G.clearAt = G.time;
  const K = S.basket;
  for (let k = 0; k < 3; k++) setTimeout(() => burst(K.x + (Math.random() - 0.5) * 0.6, 1.2 + Math.random() * 0.6, K.z + (Math.random() - 0.5) * 0.6, 70, [0xffe6a0, 0xffc46a, 0xc8e6ff, 0xffd6f0, 0xffffff], 3.0, 0.38, 1.4, 1.2), k * 260);
  burst(K.x, K.y + 0.3, K.z, 80, [0xfff0c8, 0xffffff, 0xc8e6ff], 2.2, 0.3, 1.2, 2.0);
  S.basketGlow.k = 4;
  Sound.play('clear'); Haptic([30, 60, 30]);
  logEvent('clear', { timer: +G.timer.toFixed(3), falls: G.falls });
  UI.clear();
}

// ---------------------------------------------------------------- 11 お手本（自動プレイ）
// 先を見て「目標の速さ」と「溝の中央」を保つように盤を傾ける。シャッターは開くのを待つ。
function demoInput() {
  const b = G.ball, C = S.C, J = G.demoJit || { speed: 1, uOff: 0, noise: 0 };
  if (b.mode !== 'ground') return [0, 0];
  C.frame(b.s, FR);
  const vt = v3.dot(b.v, FR.t), vl = v3.dot(b.v, FR.l);
  let vd = S.def.demoSpeed * J.speed;
  for (let d = 0; d <= 2.6; d += 0.2) {
    const s2 = b.s + d; if (s2 > C.L) break;
    C.frame(s2, FR2);
    const kk = Math.abs(FR2.kap);
    const openNear = C.isOpening(s2, 1) || C.isOpening(s2, -1);
    const aLat = openNear ? 2.0 : 3.6;
    if (kk > 0.05) vd = Math.min(vd, Math.sqrt(aLat / kk) + d * 0.9);
    if (openNear) vd = Math.min(vd, 2.1 + d * 0.6);
  }
  // ジャンプ台の手前は加速板に任せる
  const nearGap = C.gaps.some(g => b.s > g.s0 - 3.0 && b.s < g.s0);
  if (nearGap) vd = Math.max(vd, 2.2);
  // シャッター
  for (const sh of S.shutters) {
    const dist = sh.s - b.s;
    if (dist < -0.3 || dist > 4.0) continue;
    const stopAt = 0.62;
    const rem = shutterOpenRemain(sh);
    const need = (dist + 0.55) / Math.max(1.4, Math.min(vd, 2.4));
    const canGo = rem > need + 0.15 && shutterClosed(sh) === 0;
    if (dist > -0.3 && dist < 0.1) continue;   // 下を通過中
    if (!canGo) vd = Math.min(vd, dist > stopAt ? Math.sqrt(2 * 2.2 * (dist - stopAt)) : 0);
    else vd = Math.max(Math.min(vd, 2.4), 1.6);
  }
  C.frame(b.s, FR);
  const kG = CFG.G * CFG.ROLL;
  const at = 3.2 * (vd - vt) + kG * FR.t[1];
  const uT = clamp(J.uOff, -0.12, 0.12);
  const al = -16 * (b.u - uT) - 7.5 * vl + vt * vt * FR.kap;
  const th = Math.hypot(FR.t[0], FR.t[2]) || 1;
  let ax = at * FR.t[0] / th + al * FR.l[0], az = at * FR.t[2] / th + al * FR.l[2];
  if (J.noise) { ax += (J.rnd() - 0.5) * J.noise * kG * 0.3; az += (J.rnd() - 0.5) * J.noise * kG * 0.3; }
  const ix = Math.asin(clamp(ax / kG, -0.99, 0.99)) / CFG.TILT_MAX, iz = Math.asin(clamp(az / kG, -0.99, 0.99)) / CFG.TILT_MAX;
  return [clamp(ix, -1, 1), clamp(iz, -1, 1)];
}

// ---------------------------------------------------------------- 12 入力（キー・スティック・ジャイロ）
const Keys = { down: new Set(), x: 0, z: 0 };
const KEYMAP = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', ArrowUp: 'U', KeyW: 'U', ArrowDown: 'D', KeyS: 'D' };

  if (e.repeat) return;
  if (e.code === 'KeyR' || e.code === 'Space' || e.code === 'Enter') { if (UI.titleOpen) UI.play(); else if (G.state === 'intro') endIntro(); else if (G.state === 'ready') tapStart(); else if (G.state === 'clear') UI.again(); else retry(); e.preventDefault(); }
  if (e.code === 'KeyC') Cam.toggle();

});
addEventListener('keyup', e => { if (KEYMAP[e.code]) Keys.down.delete(KEYMAP[e.code]); });
addEventListener('blur', () => Keys.down.clear());

const Stick = { el: document.getElementById('stick'), knob: document.getElementById('knob'), id: null, x: 0, z: 0, active: false };
{
  const el = Stick.el;
  const set = e => {
    const r = el.getBoundingClientRect(), R = r.width * 0.36;
    let dx = (e.clientX - (r.left + r.width / 2)) / R, dy = (e.clientY - (r.top + r.height / 2)) / R;
    const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    Stick.x = dx; Stick.z = dy;
    Stick.knob.style.transform = `translate(${dx * R}px,${dy * R}px)`;
  };

  el.addEventListener('pointermove', e => { if (e.pointerId === Stick.id) set(e); });
  const up = e => { if (e.pointerId !== Stick.id) return; Stick.id = null; Stick.active = false; Stick.x = Stick.z = 0; Stick.knob.style.transform = ''; };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}

// ジャイロ：開始時の持ち方をゼロ点にして、重力の向きの変化から前後・左右の傾きを出す。
// 画面の向き（縦・横・逆さ）は screen.orientation.angle で軸を回して合わせる。
const Gyro = {
  supported: typeof window.DeviceOrientationEvent !== 'undefined',
  needsPermission: typeof window.DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function',
  permitted: null, listening: false, active: false, calibrated: false,
  alpha: null, beta: null, gamma: null, u: [0, 0, 1], u0: null, pitch0: 0, roll0: 0, count: 0, lastEvent: -1, calibAngle: 0,
  ix: 0, iz: 0, rawX: 0, rawZ: 0, sens: 1, status: '',
  // プレイ開始のタップの中で呼ぶ（iOS の許可ダイアログはユーザー操作の中でしか出せない）
  request() {
    if (!this.supported) { this.permitted = false; this.status = 'unsupported'; return Promise.resolve(false); }
    if (this.needsPermission) {
      let p;
      try { p = DeviceOrientationEvent.requestPermission(); } catch (e) { this.permitted = false; this.status = 'error'; return Promise.resolve(false); }
      return Promise.resolve(p).then(r => { this.permitted = r === 'granted'; this.status = r; if (this.permitted) this.listen(); return this.waitFirst(); })
        .catch(() => { this.permitted = false; this.status = 'denied'; return false; });
    }
    this.permitted = true; this.status = 'implicit'; this.listen();
    return this.waitFirst();
  },
  waitFirst(ms = 1500) {
    if (this.active) return Promise.resolve(true);
    return new Promise(res => {
      const t0 = performance.now();
      const iv = setInterval(() => { if (this.active || performance.now() - t0 > ms) { clearInterval(iv); res(this.active); } }, 50);
    });
  },
  listen() {
    if (this.listening) return;
    this.listening = true;
    addEventListener('deviceorientation', e => this.onEvent(e), true);
    const reCal = () => setTimeout(() => { if (this.active) this.calibrate(); }, 350);
    if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', reCal);
    addEventListener('orientationchange', reCal);
